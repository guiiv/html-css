<html lang="pt-br">

    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Porky';
            src: url(fontes/PORKH___.TTF) format('truetype'), url(fontes/PORKH___.OTF) format('opentype');

</head>
