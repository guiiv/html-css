<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
</head>
<body>
    <h1>Imagens dinamicas</h1>
    <picture>
        <source media="(max-width:750px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1058px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem grande">
    </picture>
    <h1>reproduzindo audio</h1>
 <audio preload="metadata" autoplay controls loop>
    <source src="midia/fahh.mp3" type="audio/mpeg">
    <p>infelizmente seu navegador na consegue reproduzir o audio</p>
 </audio>
</body>
</html>
