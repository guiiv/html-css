<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>teste de formularios</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuarios</label>
            <input type="text" name="usu" id="iusu" required placeholder="Digite seu nome de Usuarios" autocomplete="username" minlength="3">
        </p>

        <p>
            <label for="isen">Senha:</label>
            <input type="password" name="sen" id="isen" required placeholder="Digite uma Senha">
        </p>

        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>
    
</body>
</html>
