<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width:400px;
            height: 400px;
            border-collapse: collapse;
        }

        tr.linha{
            background-color:  gray;

        }

        td.dado{
            background-color:  yellow;
        }

        td{
            padding: 10px;
            border: 1px solid black;
            text-align: center;     /*Alinhamento horizontal */
            vertical-align: middle;   /* Alinhamento vertical */
        }

        .numero{
            text-align: right;
        }

    </style>
</head>
<body>
    <h1> Tabelas </h1>
    <table>
        <tr class="linha">
            <td>a1
            <td>b1</td>
            <td>c1</td>
        
        <tr>
            <td>a2</td>
            <td>b2</td>
            <td>c2</td>
        </tr>
        <tr>
            <td>a3</td>
            <td class="numero">b3</td>
            <td>c3</td>
        </tr>
        <tr>
            <td>a4</td>
            <td class="numero">b4</td>
            <td>c4</td>
        </tr>
    </table>    
</body>
</html>
