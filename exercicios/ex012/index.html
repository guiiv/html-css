<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com html5</title>
</head>
<body>
    <h1>Inserindo videos hospedados localmente</h1>
    <video width="700" controls>
        <source src="midias/meuvideo.mp4" type="video/mp4">
        <source src="midias/meuvideo.m4v" type="video/mp4">
        <source src="midias/meuvideo.webm" type="video/webm">
        <p>O seu navegado nao e compativel</p>
    </video>
    <h1>inserindo videos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/fJsqFb702Pg?si=subIIpXqs26jtvVR" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
