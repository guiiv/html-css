<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de Teste</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightgray;
            color: #fff;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }

        .destaque {
            background-color: #00ff37;
        }

        col.cnome {
            background-color: #ff0000;
        }

        col.cgrupo{
            background-color: #f1fc59;
        }
    </style>
</head>
<body>
<h1>Exercicios de tabela</h1>

    <table>

        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="2">
            <col class="cprof">

        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Sexo</th>
            <th>Profissao</th>
        </tr>
        <tr>
            <td>João</td>
            <td>25</td>
            <td>Masculino</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>30</td>
            <td>Feminino</td>
            <td>Medica</td>
        </tr>
    </table>
</body>
</html>
