<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parte 2</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        caption{
            font-size: 1.5em;
            padding: 10px;
        }
        table{
            border-collapse: collapse;
            width: 500px;
        }
        table, th, td{
            border: 1px solid rgba(0, 0, 0, 0.479);
            padding: 10px;
        }
        
        .area, thead{
            background-color: rgba(0, 0, 0, 0.685);
            color: white;

        }

        .num{
            text-align: center;
        }

    </style>
</head>
<body>
    <h1>Parte 2</h1>
    <table>
        <caption>Dados</caption>
        <thead>
            <th rowspan="2" scope="row">Area</th>
            <th rowspan="2" scope="row">Disciplina</th>
            <th colspan="2" scope="rowgroup">notas</th>
            <th rowspan="2" scope="row">Media</th>
            <tr>
                <th scope="col">nota 1</th>
                <th scope="col">nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="colgroup">Exatas</th>
                <td>Matematica</td>
                <td class="num">8.0</td>
                <td class="num">9.0</td>
                <td class="num">8.5</td>
            </tr>
            <tr>
                <td>Fisica</td>
                <td class="num">7.0</td>
                <td class="num">6.0</td>
                <td class="num">6.5</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td class="num">9.0</td>
                <td class="num">8.0</td>
                <td class="num">8.5</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="num">10.0</td>
                <td class="num">9.0</td>
                <td class="num">9.5</td>
            </tr>

            <tr>
                <td colspan="4" class="area">Media de Exatas</td>
                <td class="area"> 0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="colgroup">Humanas</th>
                <td>Historia</td>
                <td class="num">7.0</td>
                <td class="num">8.0</td>
                <td class="num">7.5</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="num">6.0</td>
                <td class="num">7.0</td>
                <td class="num">6.5</td>
            </tr>
            

            <tr>
                <td colspan="4" class="area">Media de Humanas</td>
                <td class="area"> 0.0</td>
            </tr>

        </tbody>

    </table>
    
</body>
</html>
